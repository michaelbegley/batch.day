<style>
:root{
  --bg:#fff;--bg2:#f5f5f7;--raise:#fff;--ink:#1d1d1f;--ink2:#6e6e73;--line:rgba(0,0,0,.08);
  --accent:#d9480f;--accent-ink:#fff;--warn:#b25e00;--warn-bg:#fff4e5;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --ease:cubic-bezier(.32,.72,0,1);--fade:cubic-bezier(.25,.1,.25,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,system-ui,sans-serif;
}
[data-theme=dark]{
  --bg:#000;--bg2:#0e0e10;--raise:#1c1c1e;--ink:#f5f5f7;--ink2:#a1a1a6;--line:rgba(255,255,255,.12);
  --accent:#ff7a3d;--accent-ink:#1d1d1f;--warn:#ffb454;--warn-bg:#2a2010;--shadow:none;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#000;--bg2:#0e0e10;--raise:#1c1c1e;--ink:#f5f5f7;--ink2:#a1a1a6;--line:rgba(255,255,255,.12);
  --accent:#ff7a3d;--accent-ink:#1d1d1f;--warn:#ffb454;--warn-bg:#2a2010;--shadow:none;}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.47 var(--font);-webkit-font-smoothing:antialiased;transition:background .3s var(--fade),color .3s var(--fade)}
button,input,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
/* bar */
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 24px;
  background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.mark{font-weight:600;font-size:19px;letter-spacing:-.02em;text-decoration:none;color:var(--ink)}
.mark b{color:var(--accent);font-weight:600}
.switch{width:52px;height:30px;border-radius:15px;border:0;background:var(--bg2);box-shadow:inset 0 0 0 1px var(--line);position:relative;cursor:pointer;padding:0}
.switch i{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--raise);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .3s var(--ease);display:grid;place-items:center}
[data-theme=dark] .switch i{transform:translateX(22px)}
.switch svg{width:13px;height:13px}
/* layout */
main{max-width:1080px;margin:0 auto;padding:0 24px}
.hero{text-align:center;padding:96px 0 40px}
h1{font-weight:600;font-size:clamp(44px,8vw,80px);line-height:1.05;letter-spacing:-.03em;margin:0}
.sub{color:var(--ink2);font-size:21px;max-width:600px;text-wrap:balance;margin:20px auto 0}
.pot{width:56px;height:56px;margin:0 auto 24px;color:var(--accent)}
.pot .steam path{stroke-dasharray:14;stroke-dashoffset:14;animation:steam 3.2s var(--fade) infinite}
.pot .steam path:nth-child(2){animation-delay:.5s}.pot .steam path:nth-child(3){animation-delay:1s}
@keyframes steam{0%{stroke-dashoffset:14;opacity:0}30%{opacity:1}70%{stroke-dashoffset:0;opacity:.8}100%{stroke-dashoffset:-14;opacity:0}}
/* card */
.card{background:var(--raise);border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--line);padding:32px;max-width:680px;margin:0 auto}
.drop{display:block;border:1.5px dashed color-mix(in srgb,var(--ink2) 45%,transparent);border-radius:18px;padding:40px 24px;text-align:center;cursor:pointer;transition:border-color .2s var(--fade),background .2s var(--fade),transform .2s var(--ease)}
.drop:hover,.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 5%,transparent)}
.drop svg{width:32px;height:32px;color:var(--ink2);margin-bottom:8px}
.drop strong{display:block;font-weight:600}
.drop span{color:var(--ink2);font-size:14px}
.or{display:flex;align-items:center;gap:12px;color:var(--ink2);font-size:14px;margin:20px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
textarea{width:100%;min-height:150px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);padding:14px 16px;resize:vertical;font-size:15px;line-height:1.5;outline:none;transition:box-shadow .2s var(--fade)}
textarea:focus,input:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:980px;padding:12px 22px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);transition:transform .15s var(--ease),opacity .2s var(--fade)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);padding:12px 4px}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:15px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.thumbs img{width:56px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.status{color:var(--ink2);font-size:14px;margin-top:12px}.status:empty,.thumbs:empty{display:none}
.bar-prog{height:4px;border-radius:2px;background:var(--bg2);overflow:hidden;margin-top:8px}
.bar-prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s var(--ease)}
/* controls */
section{padding:40px 0}
.controls{max-width:680px;margin:24px auto 0}
.seg{display:inline-flex;background:var(--bg2);border-radius:980px;padding:3px;position:relative}
.seg button{border:0;background:none;padding:8px 18px;border-radius:980px;cursor:pointer;font-size:15px;position:relative;z-index:1;color:var(--ink2);transition:color .2s var(--fade)}
.seg button[aria-pressed=true]{color:var(--ink);font-weight:600}
.seg .pill{position:absolute;top:3px;bottom:3px;left:3px;border-radius:980px;background:var(--raise);box-shadow:0 1px 3px rgba(0,0,0,.12);transition:transform .35s var(--ease),width .35s var(--ease)}
.step{display:inline-flex;align-items:center;gap:4px;background:var(--bg2);border-radius:980px;padding:3px}
.step button{width:34px;height:34px;border-radius:50%;border:0;background:var(--raise);cursor:pointer;font-size:19px;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.step button:active{transform:scale(.92)}
.step input{width:44px;text-align:center;border:0;background:none;font-weight:600;outline:none;border-radius:8px}
.label{color:var(--ink2);font-size:15px}
.flags{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px}
.flags li{background:var(--warn-bg);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.flags li:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn);margin-top:6px;flex:none}
.flags em{font-style:normal;color:var(--ink2)}
/* sheet */
.sheet{max-width:880px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;text-align:center;margin-bottom:24px}
.stat b{display:block;font-size:44px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.stat span{color:var(--ink2);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box{background:var(--raise);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow)}
.box.wide{grid-column:1/-1}
.box h3{margin:0 0 12px;font-size:19px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl td{padding:8px 0;border-top:1px solid var(--line);vertical-align:top}
.tbl tr:first-child td{border-top:0}
.tbl .q{font-weight:600;white-space:nowrap;padding-right:16px;width:1%}
.tbl .o{color:var(--ink2);font-size:13px;white-space:nowrap;text-align:right;padding-left:12px}
.tbl .sec td{color:var(--ink2);font-size:13px;padding-top:16px;border-top:0}
.tag{font-size:12px;color:var(--warn);margin-left:6px}
ol.order{list-style:none;padding:0;margin:0;counter-reset:o}
ol.order li{counter-increment:o;display:grid;grid-template-columns:28px 1fr auto;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
ol.order li:first-child{border-top:0}
ol.order li:before{content:counter(o);width:24px;height:24px;border-radius:50%;background:var(--bg2);font-size:13px;font-weight:600;display:grid;place-items:center}
ol.order small{display:block;color:var(--ink2);font-size:14px}
ol.order .t{color:var(--ink2);font-size:14px;white-space:nowrap}
.split{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.split div{background:var(--bg2);border-radius:14px;padding:16px}
.split h4{margin:0 0 6px;font-size:15px;font-weight:600}
.split p{margin:0;font-size:14px;color:var(--ink2)}
ul.plain{margin:0;padding-left:18px;font-size:15px}
ul.plain li{margin:4px 0}
.note{background:var(--warn-bg);border-radius:14px;padding:14px 16px;font-size:15px;margin-bottom:16px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--accent);font-size:15px}
.steps{font-size:15px;color:var(--ink2);padding-left:20px}
footer{color:var(--ink2);font-size:13px;text-align:center;padding:48px 24px 64px}
/* motion */
.rise{opacity:0;transform:translateY(14px)}
.rise.in{opacity:1;transform:none;transition:opacity .7s var(--fade),transform .7s var(--ease)}
.hidden{display:none!important}
.puff{position:fixed;pointer-events:none;width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:.0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:opacity .2s linear!important}.rise{transform:none}}
@media (max-width:720px){
  .hero{padding:56px 0 24px}.sub{font-size:19px}.card{padding:20px}.grid,.split{grid-template-columns:1fr}
  .stat b{font-size:32px}.bar{padding:0 16px}main{padding:0 16px}section{padding:24px 0}
}
@media print{
  .bar,.hero,#input,.controls,footer,.noprint{display:none!important}
  body{background:#fff;color:#000}.box{box-shadow:none;break-inside:avoid}.rise{opacity:1!important;transform:none!important}
}
</style>

<body>
<header class="bar">
  <a class="mark" href="./" aria-label="batch.day home">batch<b>.</b>day</a>
  <button class="switch" id="theme" role="switch" aria-checked="false" aria-label="Dark mode"><i><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5z"/></svg></i></button>
</header>

<main>
  <div class="hero">
    <svg class="pot" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <g class="steam"><path d="M20 16c-2-3 2-5 0-8"/><path d="M28 16c-2-3 2-5 0-8"/><path d="M36 16c-2-3 2-5 0-8"/></g>
      <path d="M10 24h36"/><path d="M13 24v16a6 6 0 0 0 6 6h18a6 6 0 0 0 6-6V24"/><path d="M6 28h7M43 28h7"/>
    </svg>
    <h1>Cook once.<br>Eat all week.</h1>
    <p class="sub">Drop in a recipe screenshot or paste it. Get the whole batch day: what to buy, which pot, and what to cook first.</p>
  </div>

  <section id="input">
    <div class="card rise">
      <label class="drop" id="drop" tabindex="0">
        <input type="file" id="file" accept="image/*" multiple hidden>
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="22" height="22" rx="5"/><path d="M5 21l6-6 5 5 4-4 7 7"/><circle cx="20.5" cy="11.5" r="2"/></svg>
        <strong>Drop screenshots here</strong>
        <span>Several screenshots of one recipe are fine. They stay on your device.</span>
      </label>
      <div class="thumbs" id="thumbs"></div>
      <div class="status" id="status" aria-live="polite"></div>
      <div class="bar-prog hidden" id="prog"><i></i></div>
      <div class="or">or paste it</div>
      <textarea id="text" placeholder="Paste a recipe: ingredients, steps, servings…" aria-label="Recipe text"></textarea>
      <ul class="flags" id="flags"></ul>
      <div class="row" style="margin-top:16px;justify-content:space-between">
        <button class="link" id="sample">Try a sample</button>
        <button class="btn" id="go" disabled>Plan my batch day</button>
      </div>
    </div>

    <div class="controls rise hidden" id="controls">
      <div class="row" style="justify-content:space-between">
        <div class="seg" id="mode" role="group" aria-label="Mode">
          <span class="pill"></span>
          <button aria-pressed="true" data-m="batch">Batch day</button>
          <button aria-pressed="false" data-m="scale">Just scale</button>
        </div>
        <div class="row">
          <span class="label">Recipe makes</span>
          <div class="step"><button data-t="yield" data-d="-1" aria-label="Fewer">−</button><input id="yield" class="num" inputmode="numeric" value="4" aria-label="Recipe servings"><button data-t="yield" data-d="1" aria-label="More">+</button></div>
        </div>
      </div>
      <div class="row" style="margin-top:16px;justify-content:center">
        <span class="label" id="wantLabel">I want</span>
        <div class="step"><button data-t="want" data-d="-1" aria-label="Fewer">−</button><input id="want" class="num" inputmode="numeric" value="14" aria-label="Meals wanted"><button data-t="want" data-d="1" aria-label="More">+</button></div>
        <span class="label" id="wantUnit">meals</span>
      </div>
    </div>
  </section>

  <section id="out" class="hidden">
    <div class="sheet" id="sheet"></div>
  </section>
</main>

<footer>Recipes are read on your device and never uploaded. Taste before you salt.</footer>

<script>
/* Batch Day engine: parse, stitch, scale, plan. No dependencies. */
(function (root) {
  'use strict';

  const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  // ---------- text cleanup ----------
  const FRAC = { '¼': .25, '½': .5, '¾': .75, '⅓': 1 / 3, '⅔': 2 / 3, '⅛': .125, '⅜': .375, '⅝': .625, '⅞': .875, '⅙': 1 / 6, '⅚': 5 / 6 };

  function cleanLine(s) {
    return s
      .replace(/[\u2012-\u2015\u2212]/g, '-')
      .replace(/^\s*(?:[\[|][ _|\]]{0,3}|[☐☑✓✔])\s*/u, '')          // checkboxes (incl. OCR forms)
      .replace(/^\s*(?:[•●◦▪\-–*·°©®¢«»eE]{1,3})\s+(?=\S)/u, '')            // bullets (incl. OCR forms)
      .replace(/(\d)\s?%(?=[\s-])/g, '$1½').replace(/(^|\s)%(?=\s)/g, '$1½')  // OCR: ½ read as %
      .replace(/(^|\s)[¥]?Y[2z](?=\s)/g, '$1½')
      .replace(/\btosp\b/g, 'tbsp').replace(/(\d\s*)Ibs?\b/g, '$1lbs').replace(/(\d\s*)0z\b/g, '$1oz').replace(/\s#\w+/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // keycap step numbers like "1️⃣"
  function stepNumber(s) {
    const m = s.match(/^\s*(\d{1,2})\uFE0F?\u20E3\s*/) || s.match(/^\s*(\d{1,2})[.)]\s+(?=[A-Za-z])/) ||
      s.match(/^\s*[‘’“”'"]?\s*(\d{1,2})\]?\s+(?=(?!(?:cups?|tsp|tbsp|teaspoons?|tablespoons?|oz|ounces?|lbs?|pounds?|large|medium|small|cloves?|cans?|grams?|g|ml)\b)[A-Z][a-z])/);
    return m ? { n: +m[1], rest: s.slice(m[0].length).trim() } : null;
  }

  // ---------- quantities ----------
  const NUM = String.raw`(?:\d+\s+\d+\/\d+|\d+\s*[¼½¾⅓⅔⅛⅜⅝⅞⅙⅚]|\d+\/\d+|\d*\.\d+|\d+|[¼½¾⅓⅔⅛⅜⅝⅞⅙⅚])`;
  const QTY_RE = new RegExp(String.raw`^(${NUM})(?:\s*(?:-|to)\s*(${NUM}))?`);

  function numVal(t) {
    t = t.trim();
    let m;
    if ((m = t.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +m[1] + m[2] / m[3];
    if ((m = t.match(/^(\d+)\s*([¼½¾⅓⅔⅛⅜⅝⅞⅙⅚])$/))) return +m[1] + FRAC[m[2]];
    if ((m = t.match(/^(\d+)\/(\d+)$/))) return m[1] / m[2];
    if (FRAC[t] !== undefined) return FRAC[t];
    return parseFloat(t);
  }

  const UNITS = [
    ['tbsp', /^(tablespoons?|tbsps?|tbs|tbl|T)\b\.?/],
    ['tsp', /^(teaspoons?|tsps?|t)\b\.?/],
    ['cup', /^(cups?|c)\b\.?/],
    ['fl oz', /^(fl\.?\s*oz|fluid ounces?)\b\.?/],
    ['oz', /^(ounces?|oz)\b\.?/],
    ['lb', /^(pounds?|lbs?)\b\.?/],
    ['g', /^(grams?|g)\b\.?/],
    ['kg', /^(kilograms?|kgs?)\b\.?/],
    ['ml', /^(millilit(er|re)s?|ml)\b\.?/],
    ['l', /^(lit(er|re)s?|l)\b\.?/],
    ['clove', /^(cloves?)\b/],
    ['can', /^(cans?)\b/],
    ['pinch', /^(pinch(es)?)\b/],
    ['bunch', /^(bunch(es)?)\b/],
    ['stalk', /^(stalks?)\b/],
    ['slice', /^(slices?)\b/],
    ['package', /^(packages?|pkgs?|packs?)\b/],
  ];
  // volume in tsp, weight in oz
  const VOL_TSP = { tsp: 1, tbsp: 3, cup: 48, 'fl oz': 6, ml: 0.2029, l: 202.9 };
  const WT_OZ = { oz: 1, lb: 16, g: 0.035274, kg: 35.274 };

  // OCR suspicion: "%"/"Y2"/"$" where a number should be
  function suspicious(raw) {
    return /(^|\s)(\d*%|Y2|\$)(\s|$)/.test(raw) || /^\d{2}\/\d\b/.test(raw.trim()) || /^\.\d/.test(raw.trim());
  }

  function parseIngredient(raw) {
    const line = cleanLine(raw);
    const flag = suspicious(raw) || (/[%¥]|Y2/.test(raw) && /½/.test(line)) || /^\s*\$/.test(raw);
    let fixed = line.replace(/^(\d)([1-3])\/([2-4])\b/, (m, a, b, c) => (+b < +c ? `${a} ${b}/${c}` : m));
    let rest = fixed, qty = null, qtyHi = null, unit = null;
    const m = rest.match(QTY_RE);
    if (m) {
      qty = numVal(m[1]);
      qtyHi = m[2] ? numVal(m[2]) : null;
      rest = rest.slice(m[0].length).trim();
    }
    for (const [u, re] of UNITS) {
      const ci = new RegExp(re.source.replace('|T)', ')').replace('|t)', ')'), 'i');
      const um = rest.match(ci) || rest.match(re);
      if (um) { unit = u; rest = rest.slice(um[0].length).trim(); break; }
    }
    // "(8 oz) package" style: ignore; keep name
    let name = rest.replace(/^of\s+/i, '').trim();
    let note = '';
    const cm = name.match(/^(.*?)(,\s*|\s+\()(.*)$/);
    if (cm && cm[1].length > 2) { note = (cm[3] || '').replace(/\)$/, ''); name = cm[1]; }
    const toTaste = /to taste/i.test(line);
    const optional = /optional/i.test(line);
    return { raw: line, qty, qtyHi, unit, name: name.trim(), note: note.trim(), toTaste, optional, flag };
  }

  // ---------- classify ----------
  const CLASSES = [
    ['salt', /\bsalt\b(?!ed)/i],
    ['finisher', /\b(lime|lemon|vinegar|cilantro|parsley|basil|mint|dill|chives|green onion tops|scallion tops|chili oil|chili crisp|hot sauce|sesame seeds|fresh herbs|sour cream topping)\b/i],
    ['baking', /\b(flour|baking powder|baking soda|yeast|cornmeal|cocoa|powdered sugar|granulated sugar|brown sugar|sugar|vanilla|espresso powder|chocolate|cornflakes|sprinkles)\b/i],
    ['protein', /\b(chicken|thighs?|breasts?|beef|steak|pork|turkey|sausage|bacon|tofu|tempeh|shrimp|salmon|fish|cod|lamb|ground|beans?|lentils?|chickpeas?)\b/i],
    ['grain', /\b(rice|pasta|noodles?|quinoa|orzo|couscous|barley|oats|farro|spaghetti|penne)\b/i],
    ['liquid', /\b(broth|stock|water|coconut milk|milk|cream|wine|tomato sauce|crushed tomatoes|passata)\b/i],
    ['oil', /\b(oil|butter|ghee)\b/i],
    ['aromatic', /\b(garlic|ginger|shallots?|onions?|green onion whites|scallion whites|leeks?|celery|lemongrass)\b/i],
    ['spice', /\b(pepper|paprika|cumin|chili|chile|curry|cayenne|oregano|thyme|rosemary|cinnamon|nutmeg|turmeric|garlic powder|onion powder|flakes|seasoning|soy sauce|fish sauce|gochujang|miso|paste)\b/i],
    ['veg', /\b(bok choy|spinach|kale|broccoli|carrots?|peppers?|zucchini|mushrooms?|cabbage|peas|corn|potato(es)?|sweet potato(es)?|squash|tomato(es)?|greens|cauliflower|green beans)\b/i],
    ['dairy', /\b(cheese|cream cheese|sour cream|yogurt|eggs?)\b/i],
  ];
  function classify(ing, section) {
    const s = (ing.name + ' ' + ing.note).toLowerCase();
    const sec = (section || '').toLowerCase();
    if (/finish|garnish|topping|to serve|serving/.test(sec) && !/cream cheese topping/.test(sec)) return 'finisher';
    if (/\b(broth|stock|coconut milk)\b/.test(s)) return 'liquid';
    if (/\b(cheese|sour cream|yogurt|eggs?)\b/.test(s)) return 'dairy';
    if (/garlic powder|onion powder/.test(s)) return 'spice';
    if (/ginger paste|garlic paste/.test(s)) return 'aromatic';
    if (/curry paste|tomato paste|chili paste|miso paste/.test(s)) return 'spice';
    if (/oil/.test(s) && /chili oil|chili crisp/.test(s)) return 'finisher';
    for (const [c, re] of CLASSES) if (re.test(s)) return c;
    return 'other';
  }

  function isBaking(ings, text) {
    const s = ings.map((i) => i.name).join(' ').toLowerCase() + ' ' + (text || '').toLowerCase();
    return /baking (powder|soda)|yeast/.test(s) || (/flour/.test(s) && /sugar/.test(s) && /egg/.test(s)) || /preheat oven.*(cake|muffin|cookie|bread)|\b(cake|muffins?|cookies?|brownies?|cupcakes?)\b/.test(s);
  }

  // ---------- parse a whole recipe ----------
  function parseRecipe(text) {
    const lines = text.split(/\r?\n/).map((l) => l.replace(/\s+$/, ''));
    const r = { title: '', yield: null, yieldText: '', sections: [], ingredients: [], steps: [], notes: [], flags: [] };
    let mode = 'ing', section = '', stepBuf = null;
    const pushStep = () => { if (stepBuf) { r.steps.push(stepBuf); stepBuf = null; } };
    for (let raw of lines) {
      const line = cleanLine(raw);
      if (!line) continue;
      if (/^(less|more|search\b|add comment|comment recipe|#)/i.test(line)) continue;
      const ym = line.match(/\b(serves|servings?|makes|yield[s]?)\s*:?\s*(\d+)(?:\s*(?:-|to)\s*(\d+))?/i);
      if (ym) { r.yield = ym[3] ? (+ym[2] + +ym[3]) / 2 : +ym[2]; r.yieldText = line; continue; }
      if (/^(instructions|directions|method|steps|preparation)\s*:?$/i.test(line)) { mode = 'step'; pushStep(); continue; }
      if (/^(ingredients)\s*:?$/i.test(line)) { mode = 'ing'; continue; }
      const sn = stepNumber(raw.trim());
      if (sn) { mode = 'step'; pushStep(); stepBuf = { n: sn.n, text: sn.rest }; continue; }
      if (mode === 'step') {
        if (stepBuf) stepBuf.text += ' ' + line; else stepBuf = { n: r.steps.length + 1, text: line };
        if (/[.!]$/.test(line) && !/^\d/.test(line)) { /* keep merging until next number */ }
        continue;
      }
      // header? ends with a colon, or a known section word, or a short unbulleted line that isn't a food
      const bulleted = /^\s*(?:\[[^\]]{0,3}\]|\|[ _|\]]*\|?|[☐☑✓✔•●◦▪\-–*·°©®¢«»]|[eE]\s)/u.test(raw);
      const VOCAB = /^(chicken|beef|pork|meat|protein|aromatics|broth|soup|sauce|marinade|dressing|rice|noodles|grains?|veggies|vegetables|toppings?|garnish(es)?|to serve|for serving|optional.*|cake|frosting|icing|filling|crust|dough|batter|glaze|base|seasoning|spice mix|salad|cream cheese topping|chocolate cornflakes|for the .*)$/i;
      const isHeader = !QTY_RE.test(line) && !/\d/.test(line) && line.length < 40 && (
        (/:$/.test(line)) || VOCAB.test(line.replace(/:$/, '')) ||
        (!bulleted && line.split(' ').length <= 3 && /^[A-Z]/.test(line) && classify({ name: line, note: '' }, '') === 'other'));
      if (isHeader) {
        if (!r.title && /recipe/i.test(line)) { r.title = line.replace(/\s*recipe.*$/i, '').trim(); continue; }
        section = line.replace(/:$/, '');
        if (!r.sections.includes(section)) r.sections.push(section);
        continue;
      }
      if (/recipe/i.test(line) && !QTY_RE.test(line) && !r.title) { r.title = line.replace(/\s*recipe.*$/i, '').replace(/[^\w\s'&-]/g, '').trim(); continue; }
      const prev = r.ingredients[r.ingredients.length - 1];
      if (prev && !QTY_RE.test(line) && (/^[a-z(]/.test(line) || /^[A-Za-z ]{1,20}\)$/.test(line))) { prev.note = (prev.note + ' ' + line).trim(); continue; }
      const ing = parseIngredient(line);
      // drop lines that are clearly not ingredients
      if (!ing.qty && !ing.toTaste && !/^(salt|pepper|neutral|green onion|baby|fresh|optional|red chili|parish|cilantro|chili|black pepper)/i.test(ing.name) && line.split(' ').length > 7) { r.notes.push(line); continue; }
      if (!section && !r.ingredients.length && ing.qty == null && !ing.toTaste) { r.notes.push(line); continue; }
      ing.section = section;
      ing.cls = classify(ing, section);
      if (ing.cls === 'liquid' && ing.unit === 'oz') ing.unit = 'fl oz';
      const key = norm(ing.name);
      if (key && r.ingredients.some((x) => norm(x.name) === key && x.section === section)) continue;
      if (ing.flag) r.flags.push({ type: 'amount', line: ing.raw, msg: 'Amount may have been misread' });
      if (ing.qtyHi) r.flags.push({ type: 'range', line: ing.raw, msg: 'Range: using the middle' });
      if (!ing.qty && !ing.toTaste && ing.cls !== 'finisher' && !ing.optional && !['salt', 'oil'].includes(ing.cls) && !/pepper|for cooking|for frying/i.test(ing.raw)) r.flags.push({ type: 'noamount', line: ing.raw, msg: 'No amount given' });
      r.ingredients.push(ing);
    }
    pushStep();
    r.steps.sort((a, b) => a.n - b.n);
    // de-dup steps by number
    const best = {};
    r.steps.forEach((st) => { if (!best[st.n] || st.text.length > best[st.n].text.length) best[st.n] = st; });
    r.steps = Object.values(best).sort((a, b) => a.n - b.n);
    const lastStep = r.steps[r.steps.length - 1];
    if (lastStep && !/[.!)]$/.test(lastStep.text.trim())) r.flags.push({ type: 'cutoff', line: lastStep.text.slice(-40), msg: 'Steps look cut off' });
    r.baking = isBaking(r.ingredients, text);
    if (!r.yield) {
      const prot = r.ingredients.filter((i) => i.cls === 'protein' && i.qty && (i.unit === 'lb' || i.unit === 'oz' || i.unit === 'g' || i.unit === 'kg'));
      if (prot.length) {
        const oz = prot.reduce((s, i) => s + mid(i) * WT_OZ[i.unit], 0);
        r.yield = Math.max(1, Math.round(oz / 6));
        r.yieldGuessed = true;
        r.flags.push({ type: 'yield', line: '', msg: `No servings listed. Guessing ${r.yield} from the protein; change it if you know.` });
      } else { r.yield = 4; r.yieldGuessed = true; r.flags.push({ type: 'yield', line: '', msg: 'No servings listed. Guessing 4; change it if you know.' }); }
    }
    return r;
  }

  const mid = (i) => (i.qtyHi ? (i.qty + i.qtyHi) / 2 : i.qty);

  // ---------- stitch several screenshots ----------
  function overlap(a, b) { // lines at end of a that match start of b
    const A = a.split('\n').map(norm).filter(Boolean), B = b.split('\n').map(norm).filter(Boolean);
    let best = 0;
    for (let k = Math.min(A.length, B.length); k >= 2; k--) {
      let ok = 0;
      for (let i = 0; i < k; i++) if (A[A.length - k + i] === B[i]) ok++;
      if (ok >= Math.max(2, Math.ceil(k * 0.6))) { best = k; break; }
    }
    // weaker signal: shared line anywhere
    const shared = A.filter((l) => l.length > 12 && B.includes(l)).length;
    return { tail: best, shared };
  }
  function stitch(texts) {
    const n = texts.length;
    if (n <= 1) return [{ order: [0], text: texts[0] || '' }];
    const W = [...Array(n)].map(() => Array(n).fill(0));
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (i !== j) { const o = overlap(texts[i], texts[j]); W[i][j] = o.tail * 10 + o.shared; }
    // components by shared lines
    const parent = [...Array(n).keys()];
    const find = (x) => (parent[x] === x ? x : (parent[x] = find(parent[x])));
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (W[i][j] > 0) parent[find(i)] = find(j);
    const groups = {};
    for (let i = 0; i < n; i++) (groups[find(i)] = groups[find(i)] || []).push(i);
    const out = [];
    for (const g of Object.values(groups)) {
      // greedy chain: start = node with least incoming weight
      const inW = (j) => g.reduce((s, i) => s + (i === j ? 0 : W[i][j]), 0);
      let cur = g.slice().sort((a, b) => inW(a) - inW(b))[0];
      const order = [cur], left = new Set(g.filter((x) => x !== cur));
      while (left.size) {
        let nx = null, bw = -1;
        for (const j of left) if (W[cur][j] > bw) { bw = W[cur][j]; nx = j; }
        order.push(nx); left.delete(nx); cur = nx;
      }
      // texts with step numbers go after the ingredient-only ones, in step order
      const minStep = (i) => { let m = Infinity; texts[i].split('\n').forEach((l) => { const sn = stepNumber(l); if (sn) m = Math.min(m, sn.n); }); return m; };
      const chainPos = new Map(order.map((x, k) => [x, k]));
      const key = (i) => (minStep(i) === Infinity ? -1 : minStep(i));
      order.sort((a, b) => (key(a) - key(b)) || (chainPos.get(a) - chainPos.get(b)));
      // merge, dropping duplicate lines (keep first time we see a line)
      const seen = new Set(), lines = [];
      for (const idx of order) for (const l of texts[idx].split('\n')) {
        const k = norm(l);
        if (k && k.length > 3 && seen.has(k)) continue;
        if (k) seen.add(k);
        lines.push(l);
      }
      out.push({ order, text: lines.join('\n') });
    }
    return out;
  }

  // ---------- scaling ----------
  function factorFor(cls, f, baking) {
    if (f <= 2 || baking) return f;
    if (cls === 'salt') return f * 0.7;
    if (cls === 'spice') return f * 0.75;
    if (cls === 'oil') return f * 0.6;
    return f;
  }

  function niceFrac(x, step) {
    const r = Math.round(x / step) * step;
    return r <= 0 ? step : r;
  }
  function fmtNum(x) {
    const whole = Math.floor(x + 1e-9), frac = x - whole;
    const map = [[0, ''], [.125, '⅛'], [.25, '¼'], [1 / 3, '⅓'], [.5, '½'], [2 / 3, '⅔'], [.75, '¾'], [1, '']];
    let best = map[0], d = 9;
    for (const m of map) if (Math.abs(frac - m[0]) < d) { d = Math.abs(frac - m[0]); best = m; }
    const w = best[0] === 1 ? whole + 1 : whole;
    if (!w && !best[1]) return '0';
    return (w ? w : '') + best[1];
  }
  // turn a volume (tsp) into a friendly measure
  function fmtVol(tsp) {
    if (tsp < 3 * 0.95) return [niceFrac(tsp, .25), 'tsp'];
    if (tsp < 12 * 0.95) return [niceFrac(tsp / 3, .5), 'tbsp'];
    return [niceFrac(tsp / 48, .25), 'cup'];
  }
  function fmtWt(oz) {
    if (oz >= 16) return [Math.round(oz / 16 * 4) / 4, 'lb'];
    return [Math.round(oz * 2) / 2, 'oz'];
  }
  function show(n, u) {
    const plural = { cup: 'cups', clove: 'cloves', can: 'cans', slice: 'slices', stalk: 'stalks', bunch: 'bunches', package: 'packages', pinch: 'pinches' };
    const label = n > 1 && plural[u] ? plural[u] : u;
    return u ? `${fmtNum(n)} ${label}` : fmtNum(n);
  }

  function scaleIngredient(ing, f, baking) {
    const out = Object.assign({}, ing);
    if (ing.qty == null) { out.scaled = ing.toTaste ? 'to taste' : (['finisher', 'salt', 'oil'].includes(ing.cls) || Math.abs(f - 1) < .05 ? '' : `${Math.round(f * 10) / 10}× usual`); return out; }
    const q = mid(ing) * factorFor(ing.cls, f, baking);
    out.adjusted = f > 2 && !baking && ['salt', 'spice', 'oil'].includes(ing.cls);
    let n = q, u = ing.unit;
    if (u && VOL_TSP[u] && !['ml', 'l'].includes(u)) [n, u] = fmtVol(q * VOL_TSP[u]);
    else if (u && WT_OZ[u] && !['g', 'kg'].includes(u)) [n, u] = fmtWt(q * WT_OZ[u]);
    else if (!u || ['clove', 'can', 'slice', 'stalk', 'bunch', 'package'].includes(u)) n = /egg/i.test(ing.name) || u ? Math.max(1, Math.round(q)) : niceFrac(q, .5);
    else n = Math.round(q * 10) / 10;
    if (u === 'pinch') { n = Math.max(1, Math.round(q)); }
    out.qtyScaled = q;
    out.scaled = show(n, u);
    return out;
  }

  // ---------- Batch Day plan ----------
  function cupsOf(i, f) { // rough volume in cups after scaling
    if (i.qty == null) return 0;
    const q = mid(i) * f;
    if (i.unit && VOL_TSP[i.unit]) return q * VOL_TSP[i.unit] / 48;
    if (i.unit && WT_OZ[i.unit]) return q * WT_OZ[i.unit] / 8; // ~1 cup per 8 oz
    return 0;
  }

  const POTS = [3, 4, 6, 8, 12, 16, 20]; // quarts
  function potFor(cups, fill) { const q = cups / 4 / fill; return POTS.find((p) => p >= q) || null; }

  function batchDay(recipe, meals, opts) {
    opts = opts || {};
    const f = meals / recipe.yield;
    const baking = recipe.baking;
    const items = recipe.ingredients.map((i) => scaleIngredient(i, f, baking));
    const plan = { factor: f, meals, baking, items, pots: [], order: [], split: { freezer: [], fridge: [], fresh: [] }, grocery: [], notes: [], rice: null };

    if (baking) {
      const batches = Math.ceil(f / 2);
      plan.notes.push(f > 2
        ? `Baking doesn't scale well past 2x. Make ${batches} batches of ${fmtNum(f / batches)}x instead of one giant one.`
        : 'Baking: measure carefully. Same oven temperature; check doneness a few minutes early.');
    }

    const by = (c) => items.filter((i) => i.cls === c);
    const protein = by('protein'), liquid = by('liquid'), grain = by('grain'), veg = by('veg'), fin = by('finisher');

    // rice/grain with no amount: 1/3 cup dry per meal (rough estimate)
    grain.forEach((g) => {
      if (g.qty == null && /rice|quinoa|orzo|couscous/i.test(g.name)) {
        const dry = meals / 3;
        g.scaled = `${fmtNum(niceFrac(dry, .5))} cups dry (about ⅓ cup per meal — estimate)`;
        g.estimated = true;
        plan.rice = dry;
      } else if (g.qty != null && /rice/i.test(g.name)) plan.rice = cupsOf(g, f);
    });

    // pots
    const soupCups = liquid.reduce((s, i) => s + cupsOf(i, f), 0) + protein.reduce((s, i) => s + cupsOf(i, f), 0) * 0.9 + veg.reduce((s, i) => s + cupsOf(i, f), 0);
    if (!baking && soupCups > 0) {
      const q = potFor(soupCups, 0.75);
      plan.pots.push(q ? `Main pot: ${q} qt or bigger (about ${Math.round(soupCups)} cups of food, kept under ¾ full)` : `Main pot: about ${Math.round(soupCups)} cups of food — split across two big pots`);
    }
    if (plan.rice) {
      const q = potFor(plan.rice, 1 / 3);
      plan.pots.push(q ? `Rice pot: ${q} qt (dry rice under ⅓ full — it triples)` : 'Rice: cook in two pots or batches');
    }
    const lbs = protein.reduce((s, i) => s + (i.qty != null && i.unit && WT_OZ[i.unit] ? mid(i) * f * WT_OZ[i.unit] / 16 : 0), 0);
    if (lbs > 0 && /sear|brown|pan-?fry|golden/i.test(recipe.steps.map((s) => s.text).join(' '))) {
      const batches = Math.max(1, Math.ceil(lbs / 1.5));
      plan.pots.push(`Searing: ${batches} batch${batches > 1 ? 'es' : ''} in a 12-inch pan (about 1½ lb each). Don't crowd it, or it steams.`);
    }

    // order of operations
    const stepsTxt = recipe.steps.map((s) => s.text.toLowerCase()).join(' ');
    if (!baking) {
      if (plan.rice) plan.order.push({ t: 'Start the rice first', d: 'It runs on its own while you do everything else.', min: 25 });
      if (protein.length) plan.order.push({ t: `Season the ${protein[0].name.replace(/boneless|skinless/gi, '').trim()}`, d: 'Season all of it at once in a big bowl.', min: 5 });
      if (/sear|brown|pan-?fry|golden/.test(stepsTxt)) plan.order.push({ t: 'Sear in batches', d: 'Set each batch aside; it finishes cooking later.', min: Math.max(1, Math.ceil(lbs / 1.5)) * 6 });
      if (by('aromatic').length) plan.order.push({ t: 'Aromatics in the big pot', d: 'Same pot, scrape up the browned bits.', min: 4 });
      if (/paste|bloom/.test(stepsTxt)) plan.order.push({ t: 'Bloom the paste', d: 'About a minute, until it smells great.', min: 2 });
      if (liquid.length) plan.order.push({ t: 'Liquids in, bring to a simmer', d: 'A big pot takes a lot longer to simmer. Taste now, but hold back on salt.', min: 15 });
      if (protein.length && liquid.length) plan.order.push({ t: 'Protein back in until cooked through', d: 'Judge by doneness, not the clock (165°F for chicken).', min: 15 });
      if (veg.some((v) => /bok choy|spinach|kale|greens/i.test(v.name))) plan.order.push({ t: 'Skip the tender greens for now', d: 'Add them when you reheat each portion so they stay bright.', min: 0 });
      plan.order.push({ t: 'Taste and adjust', d: 'Now add the rest of the salt and spice if it needs it.', min: 3 });
      plan.order.push({ t: 'Cool, then portion', d: 'Shallow containers, into the fridge within 2 hours.', min: 20 });
    } else {
      plan.order.push({ t: 'Mix and bake in batches', d: 'Follow the recipe steps for each batch.', min: 0 });
    }
    plan.totalMin = plan.order.reduce((s, o) => s + o.min, 0);

    // split
    const fridgeMeals = Math.min(meals, opts.fridgeMeals || 4);
    if (!baking) {
      plan.split.fridge.push(`${fridgeMeals} meals for this week (eat within 4 days)`);
      if (meals > fridgeMeals) plan.split.freezer.push(`${meals - fridgeMeals} meals: protein and broth together, rice in its own bag`);
      fin.concat(veg.filter((v) => /bok choy|spinach|kale|greens/i.test(v.name))).forEach((i) => plan.split.fresh.push(i.name));
    } else {
      plan.split.fridge.push('Keep covered at room temp 2 days or fridge 5 days');
      plan.split.freezer.push('Most bakes freeze well wrapped tight (frost after thawing)');
    }

    // grocery: everything with an amount, finishers per bowl
    items.forEach((i) => {
      if (i.cls === 'finisher' && i.qty == null) plan.grocery.push({ name: i.name, amt: 'for serving' });
      else if (i.qty != null || i.estimated) plan.grocery.push({ name: i.name, amt: i.scaled });
      else if (!i.toTaste) plan.grocery.push({ name: i.name, amt: '' });
    });
    return plan;
  }

  function scaleAll(recipe, target) {
    const f = target / recipe.yield;
    return { factor: f, items: recipe.ingredients.map((i) => scaleIngredient(i, f, recipe.baking)) };
  }

  const api = { parseRecipe, parseIngredient, stitch, scaleAll, batchDay, fmtNum };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.BatchEngine = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function(){
'use strict';
const $=(s)=>document.querySelector(s), E=window.BatchEngine;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let recipe=null, mode='batch', files=[];

/* theme */
const root=document.documentElement, sw=$('#theme');
function curTheme(){return root.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function syncSwitch(){sw.setAttribute('aria-checked',curTheme()==='dark')}
syncSwitch();
sw.onclick=()=>{const t=curTheme()==='dark'?'light':'dark';root.dataset.theme=t;try{localStorage.setItem('bd-theme',t)}catch(e){};syncSwitch()};

/* reveal */
const io=new IntersectionObserver((es)=>es.forEach((e)=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1});
function watch(el,delay){if(delay)el.style.transitionDelay=delay+'ms';io.observe(el)}
document.querySelectorAll('.rise').forEach((el)=>watch(el));

/* input */
const text=$('#text'), go=$('#go');
function onText(){go.disabled=!text.value.trim();}
text.addEventListener('input',()=>{onText();recipe=null});
$('#sample').onclick=()=>{text.value=SAMPLE;onText();text.focus();parseNow()};

const drop=$('#drop'), file=$('#file');
drop.addEventListener('keydown',(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();file.click()}});
['dragenter','dragover'].forEach((t)=>drop.addEventListener(t,(e)=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach((t)=>drop.addEventListener(t,(e)=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',(e)=>handleFiles([...e.dataTransfer.files]));
file.addEventListener('change',()=>handleFiles([...file.files]));
document.addEventListener('paste',(e)=>{const imgs=[...(e.clipboardData||{}).items||[]].filter((i)=>i.type.startsWith('image/')).map((i)=>i.getAsFile());if(imgs.length){e.preventDefault();handleFiles(imgs)}});

function setStatus(s){$('#status').textContent=s}
function prog(p){const b=$('#prog');b.classList.toggle('hidden',p==null);if(p!=null)b.firstElementChild.style.width=Math.round(p*100)+'%'}

let tess=null;
function loadTesseract(){
  if(window.Tesseract)return Promise.resolve();
  if(tess)return tess;
  tess=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=ok;s.onerror=()=>no(new Error('load'));document.head.appendChild(s)});
  return tess;
}
// clean up a screenshot so the text reader can see it
function prepImage(f){
  return new Promise((ok)=>{const img=new Image();img.onload=()=>{
    const tall=img.height/img.width>1.6;
    const sx=0, sy=tall?Math.round(img.height*.28):0, sw=tall?Math.round(img.width*.82):img.width, sh=tall?Math.round(img.height*.6):img.height;
    const c=document.createElement('canvas');c.width=sw*2;c.height=sh*2;const x=c.getContext('2d');
    x.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
    const d=x.getImageData(0,0,c.width,c.height),p=d.data;let sum=0;
    for(let i=0;i<p.length;i+=4)sum+=.299*p[i]+.587*p[i+1]+.114*p[i+2];
    const dark=sum/(p.length/4)<110;
    for(let i=0;i<p.length;i+=4){const g=.299*p[i]+.587*p[i+1]+.114*p[i+2];const v=dark?(g>185?0:255):(g<140?0:255);p[i]=p[i+1]=p[i+2]=v}
    x.putImageData(d,0,0);ok(c);URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(f)});
}
async function handleFiles(list){
  list=list.filter((f)=>f&&f.type.startsWith('image/'));if(!list.length)return;
  files=list;const th=$('#thumbs');th.innerHTML='';
  list.forEach((f)=>{const i=new Image();i.src=URL.createObjectURL(f);i.alt='';th.appendChild(i)});
  setStatus(`Reading ${list.length} screenshot${list.length>1?'s':''}…`);prog(0);
  try{await loadTesseract()}catch(e){setStatus("Couldn't load the reader. Check your connection, or paste the recipe instead.");prog(null);return}
  const texts=[];
  try{
    const worker=await Tesseract.createWorker('eng');
    for(let k=0;k<list.length;k++){
      const c=await prepImage(list[k]);const {data}=await worker.recognize(c);texts.push(data.text);prog((k+1)/list.length);
    }
    await worker.terminate();
  }catch(e){setStatus("Couldn't read that image. Try a clearer screenshot, or paste the text.");prog(null);return}
  const groups=E.stitch(texts);
  text.value=groups.map((g)=>g.text.trim()).join('\n\n---\n\n');
  prog(null);
  setStatus(groups.length>1?`Found ${groups.length} recipes. Planning the first one; check the text below.`:'Got it. Check the highlighted lines, then plan.');
  onText();parseNow();
}

function parseNow(){
  const raw=text.value.split(/\n-{3,}\n/)[0];
  recipe=E.parseRecipe(raw);
  $('#yield').value=recipe.yield;
  const fl=$('#flags');fl.innerHTML='';
  recipe.flags.forEach((f)=>{const li=document.createElement('li');li.innerHTML=`<span>${esc(f.msg)}${f.line?` <em>“${esc(f.line.slice(0,60))}”</em>`:''}</span>`;fl.appendChild(li)});
  const c=$('#controls');c.classList.remove('hidden');requestAnimationFrame(()=>c.classList.add('in'));
  moveSeg();
  if(recipe.baking&&mode==='batch')setMode('scale');
}
go.onclick=()=>{if(!recipe)parseNow();else{recipe.yield=+$('#yield').value||recipe.yield}render(true);puff(go)};

/* controls */
document.querySelectorAll('.step button').forEach((b)=>b.onclick=()=>{const i=$('#'+b.dataset.t);i.value=Math.max(1,(+i.value||1)+(+b.dataset.d));if(!$('#out').classList.contains('hidden'))render(false)});
['yield','want'].forEach((id)=>$('#'+id).addEventListener('change',()=>{if(!$('#out').classList.contains('hidden'))render(false)}));
function setMode(m){mode=m;document.querySelectorAll('#mode button').forEach((b)=>b.setAttribute('aria-pressed',b.dataset.m===m));
  $('#wantLabel').textContent=m==='batch'?'I want':'Make it';$('#wantUnit').textContent=m==='batch'?'meals':'servings';
  if(m==='scale'&&+$('#want').value===14)$('#want').value=Math.max(1,recipe?recipe.yield*2:8);
  if(m==='batch'&&recipe&&+$('#want').value===recipe.yield*2)$('#want').value=14;
  moveSeg();if(!$('#out').classList.contains('hidden'))render(false)}
document.querySelectorAll('#mode button').forEach((b)=>b.onclick=()=>setMode(b.dataset.m));
function moveSeg(){const on=$('#mode button[aria-pressed=true]'),p=$('#mode .pill');if(!on.offsetWidth)return;p.style.width=on.offsetWidth+'px';p.style.transform=`translateX(${on.offsetLeft-3}px)`}
addEventListener('resize',moveSeg);

/* render */
function esc(s){return String(s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtX(f){return (Math.round(f*10)/10).toString().replace(/\.0$/,'')}
function ingRows(items){
  let sec=null,h='';
  items.forEach((i)=>{
    if(i.section!==sec){sec=i.section;if(sec)h+=`<tr class="sec"><td colspan="3">${esc(sec)}</td></tr>`}
    const orig=i.qty==null?'':esc(i.raw.match(/^[^a-zA-Z]*[a-zA-Z]*/)[0].trim());
    h+=`<tr><td class="q num">${esc(i.scaled||'')}</td><td>${esc(i.name)}${i.adjusted?'<span class="tag">eased back</span>':''}${i.estimated?'<span class="tag">estimate</span>':''}</td><td class="o num">${orig}</td></tr>`;
  });
  return h;
}
function render(scroll){
  if(!recipe)parseNow();
  recipe.yield=Math.max(1,+$('#yield').value||recipe.yield);
  const want=Math.max(1,+$('#want').value||1), out=$('#out'), sh=$('#sheet');
  let h='';
  if(mode==='batch'){
    const p=E.batchDay(recipe,want);
    h+=`<div class="stats"><div class="stat rise"><b class="num" data-n="${want}">${want}</b><span>meals</span></div><div class="stat rise"><b class="num" data-n="${fmtX(p.factor)}" data-x>${fmtX(p.factor)}×</b><span>the recipe</span></div><div class="stat rise"><b class="num" data-n="${Math.round(p.totalMin/5)*5}" data-m>${Math.round(p.totalMin/5)*5}</b><span>minutes, about</span></div></div>`;
    p.notes.forEach((n)=>h+=`<div class="note rise">${esc(n)}</div>`);
    h+=`<div class="grid">`;
    h+=`<div class="box rise"><h3>Shopping amounts</h3><table class="tbl">${ingRows(p.items)}</table></div>`;
    h+=`<div class="box rise"><h3>Cook order</h3><ol class="order">${p.order.map((o)=>`<li><div>${esc(o.t)}<small>${esc(o.d)}</small></div><span class="t num">${o.min?o.min+' min':''}</span></li>`).join('')}</ol></div>`;
    if(p.pots.length)h+=`<div class="box rise wide"><h3>Pots and pans</h3><ul class="plain">${p.pots.map((x)=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
    h+=`<div class="box rise wide"><h3>Where it all goes</h3><div class="split"><div><h4>Freezer</h4><p>${esc(p.split.freezer.join(' ')||'Nothing this time.')}</p></div><div><h4>Fridge</h4><p>${esc(p.split.fridge.join(' '))}</p></div><div><h4>Fresh at serving</h4><p>${esc(p.split.fresh.join(', ')||'Nothing extra.')}</p></div></div></div>`;
    const list=p.grocery.map((g)=>g.amt==='for serving'?`${g.name} (for serving)`:`${g.amt?g.amt+' ':''}${g.name}`).join('\n');
    h+=`<div class="box rise wide"><h3>Grocery list <span class="row noprint"><button class="link" data-copy>Copy</button><button class="link" data-print>Print</button></span></h3><ul class="plain">${p.grocery.map((g)=>g.amt==='for serving'?`<li>${esc(g.name)} <span style="color:var(--ink2)">for serving</span></li>`:`<li><span class="num">${esc(g.amt)}</span> ${esc(g.name)}</li>`).join('')}</ul><textarea hidden id="glist">${esc(list)}</textarea></div>`;
    h+=`</div>`;
  }else{
    const s=E.scaleAll(recipe,want);
    if(recipe.baking&&s.factor>2)h+=`<div class="note rise">Baking doesn't scale well past 2×. Make ${Math.ceil(s.factor/2)} batches instead of one big one.</div>`;
    h+=`<div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat rise"><b class="num" data-n="${want}">${want}</b><span>servings</span></div><div class="stat rise"><b class="num" data-n="${fmtX(s.factor)}" data-x>${fmtX(s.factor)}×</b><span>the recipe</span></div></div>`;
    h+=`<div class="box rise"><h3>Scaled ingredients <span class="noprint"><button class="link" data-print>Print</button></span></h3><table class="tbl">${ingRows(s.items)}</table></div>`;
  }
  if(recipe.steps.length)h+=`<details class="rise"><summary>Original steps</summary><ol class="steps">${recipe.steps.map((s)=>`<li>${esc(s.text)}</li>`).join('')}</ol></details>`;
  sh.innerHTML=h;out.classList.remove('hidden');
  sh.querySelectorAll('.rise').forEach((el,k)=>watch(el,Math.min(k,8)*50));
  sh.querySelectorAll('[data-print]').forEach((b)=>b.onclick=()=>{try{print()}catch(e){}});
  const cp=sh.querySelector('[data-copy]');if(cp)cp.onclick=()=>{navigator.clipboard.writeText($('#glist').value).then(()=>{cp.textContent='Copied';setTimeout(()=>cp.textContent='Copy',1600)})};
  if(scroll){count(sh);out.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'})}
}
function count(sh){
  if(reduce)return;
  sh.querySelectorAll('[data-n]').forEach((b)=>{const end=parseFloat(b.dataset.n),x=b.hasAttribute('data-x'),t0=performance.now(),dur=700;
    (function tick(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3),v=end*e;b.textContent=(x?fmtX(v)+'×':Math.round(v));if(k<1)requestAnimationFrame(tick)})(t0)});
}
// signature moment: three little puffs of steam rise from the button
function puff(el){
  if(reduce)return;const r=el.getBoundingClientRect();
  for(let k=0;k<3;k++){const d=document.createElement('span');d.className='puff';document.body.appendChild(d);
    const x=r.left+r.width/2+(k-1)*14,y=r.top;d.style.left=x+'px';d.style.top=y+'px';
    d.animate([{opacity:0,transform:'translateY(0) scale(.6)'},{opacity:.55,transform:'translateY(-14px) scale(1)'},{opacity:0,transform:'translateY(-36px) scale(1.6)'}],{duration:900,delay:k*90,easing:'cubic-bezier(.25,.1,.25,1)'}).onfinish=()=>d.remove()}
}

const SAMPLE=`Brothy chicken and rice
Serves 4

Chicken
1½–2 lbs boneless chicken thighs
Salt & black pepper
1 tsp ginger paste
½ tsp garlic powder
Neutral oil, for cooking

Aromatics
Green onion whites, sliced
2–5 cloves garlic, minced
1–2 tsp ginger paste
Red chili flakes, to taste

Broth
16 oz chicken bone broth
5 oz coconut milk
1½ tbsp red curry paste
1–2 tsp soy sauce

Rice
1 cup jasmine rice

Optional finish
Baby bok choy
Green onion tops
Fresh lime juice
Chili oil

Directions
1. Season chicken with salt, pepper, ginger paste and garlic powder.
2. Cook the rice and set aside.
3. Heat oil in a heavy pot. Pan-fry the chicken until golden on both sides. Set aside.
4. In the same pot, soften the green onion whites, then add garlic, ginger and chili flakes.
5. Stir in the curry paste and cook about 1 minute.
6. Pour in the broth, coconut milk and soy sauce. Simmer a few minutes.
7. Add the chicken back and simmer until cooked through. Add bok choy until just tender.
8. Spoon rice into bowls, ladle the broth over, and finish with green onion, lime and chili oil.`;
})();
